# nginx.conf - minimal reverse proxy in front of the gunicorn "web" service.
# Kept deliberately simple (this mirrors a config proven to work on the Pi).
# No IPv6 listener, no top-level "user"/"pid" directives — those are the usual
# causes of nginx exiting on startup inside a minimal Docker network.

events {
    worker_connections 1024;
}

http {
    upstream raman_app {
        server web:5000;
    }

    server {
        listen 80;
        server_name _;

        # Allow large uploads (bulk ICD-10 / medication spreadsheets).
        client_max_body_size 100M;

        location / {
            proxy_pass http://raman_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream responses straight to the client (needed so large CSV
            # exports download progressively rather than being buffered whole).
            proxy_buffering off;

            # Read/send timeouts must exceed gunicorn's worker timeout so large
            # synchronous exports complete instead of being cut off.
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location /health {
            proxy_pass http://raman_app;
            access_log off;
        }
    }
}

# To add HTTPS later: add a second `server { listen 443 ssl; ... }` block with
# your certificate paths, and mount the certs into the nginx container.
